name: setup CI

on:
  push:
    branches: ['**']

jobs:
  test_setup:
    runs-on: ${{ matrix.os }}
    name: Test setup action (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: A version given
        id: given
        uses: ./setup
        with:
          cli-version: "0.48.0"
      - name: Verify it runs
        shell: bash
        env:
          RAN: ${{ steps.given.outputs.cli-version }}
        run: |
          remotive --version
          test "$RAN" = "0.48.0"
          test "$(remotive toolchain --version)" = "RemotiveLabs Toolchain Manager 0.0.18"

      - name: A version that is not available
        id: unavailable
        continue-on-error: true
        uses: ./setup
        with:
          cli-version: "9.9.9"
      - name: Verify it fails, and the default is unchanged
        shell: bash
        env:
          OUTCOME: ${{ steps.unavailable.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          test "$(remotive --version | awk '{print $2; exit}')" = "0.48.0"

      - name: Pin a version in a workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/workspace/sub"
          printf 'tools:\n  cli:\n    version: "0.47.0"\n' > "$RUNNER_TEMP/workspace/remotive.yaml"
      - name: The workspace's version
        id: pinned
        uses: ./setup
        with:
          working-directory: ${{ runner.temp }}/workspace/sub
      - name: Verify the workspace's version runs there
        shell: bash
        working-directory: ${{ runner.temp }}/workspace/sub
        env:
          RAN: ${{ steps.pinned.outputs.cli-version }}
        run: |
          remotive --version
          test "$RAN" = "0.47.0"

      - name: A version given, in a workspace that pins another
        id: both
        uses: ./setup
        with:
          cli-version: "0.49.1"
          working-directory: ${{ runner.temp }}/workspace/sub
      - name: Verify the pin runs in the workspace, and the version given elsewhere
        shell: bash
        working-directory: ${{ runner.temp }}/workspace/sub
        env:
          RAN: ${{ steps.both.outputs.cli-version }}
        run: |
          test "$RAN" = "0.47.0"
          cd "$GITHUB_WORKSPACE" && test "$(remotive --version | awk '{print $2; exit}')" = "0.49.1"

  test_toolchain_manager_version:
    runs-on: ubuntu-latest
    name: Test setup action with a Toolchain Manager version given

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Not published: a step that ignored the input would install the default
      - name: A Toolchain Manager version given
        id: given
        continue-on-error: true
        uses: ./setup
        with:
          toolchain-manager-version: "999.0.0"
      - name: Verify it is used
        shell: bash
        env:
          OUTCOME: ${{ steps.given.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          test ! -e "$HOME/.local/bin/remotive"

  test_remotivebus:
    runs-on: ${{ matrix.os }}
    name: Test setup action with RemotiveBus (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: A RemotiveBus version given
        uses: ./setup
        with:
          remotivebus: true
          remotivebus-version: "0.12.0"
      - name: Verify it runs, with the CAN modules loaded
        shell: bash
        run: |
          test "$(remotivebus --version)" = "remotivebus 0.12.0"
          systemctl is-active remotivebusd
          sudo test -S /run/docker/plugins/remotivebus.sock  # the directory is root's
          for module in vcan vxcan can_gw; do grep -q "^$module " /proc/modules; done

  test_remotivebus_not_on_macos:
    runs-on: macos-latest
    name: Test setup action with RemotiveBus on macOS

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: RemotiveBus asked for
        id: asked
        continue-on-error: true
        uses: ./setup
        with:
          remotivebus: true
      - name: Verify it fails
        shell: bash
        env:
          OUTCOME: ${{ steps.asked.outcome }}
        run: test "$OUTCOME" = "failure"
