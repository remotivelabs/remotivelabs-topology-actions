name: setup CI

on:
  push:
    branches: ['**']

jobs:
  test_setup:
    runs-on: ${{ matrix.os }}
    name: Test setup action (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: A version given
        id: given
        uses: ./setup
        with:
          cli-version: "0.48.0"
      - name: Verify it runs
        shell: bash
        env:
          RAN: ${{ steps.given.outputs.cli-version }}
        run: |
          remotive --version
          test "$RAN" = "0.48.0"
          test "$(remotive toolchain --version)" = "RemotiveLabs Toolchain Manager 0.0.18"

      - name: Pin a version in a workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/workspace/sub"
          printf 'tools:\n  cli:\n    version: "0.47.0"\n' > "$RUNNER_TEMP/workspace/remotive.yaml"
      - name: The workspace's version
        id: pinned
        uses: ./setup
        with:
          working-directory: ${{ runner.temp }}/workspace/sub
      - name: Verify the workspace's version runs there
        shell: bash
        working-directory: ${{ runner.temp }}/workspace/sub
        env:
          RAN: ${{ steps.pinned.outputs.cli-version }}
        run: |
          remotive --version
          test "$RAN" = "0.47.0"

      - name: Allow a range in a workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ranged"
          printf 'requires-version: ">=0.45,<0.47"\n' > "$RUNNER_TEMP/ranged/remotive.yaml"
      - name: The newest release in the workspace's range
        id: ranged
        uses: ./setup
        with:
          working-directory: ${{ runner.temp }}/ranged
      - name: Verify the newest release in the range runs
        shell: bash
        env:
          RAN: ${{ steps.ranged.outputs.cli-version }}
        run: |
          case "$RAN" in 0.46.*) ;; *) echo "ran $RAN"; exit 1 ;; esac

  test_toolchain_manager_version:
    runs-on: ubuntu-latest
    name: Test setup action with a Toolchain Manager version given

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Not published: a step that ignored the input would install the default
      - name: A Toolchain Manager version given
        id: given
        continue-on-error: true
        uses: ./setup
        with:
          toolchain-manager-version: "0.0.99"
      - name: Verify it is used
        shell: bash
        env:
          OUTCOME: ${{ steps.given.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          test ! -e "$HOME/.local/bin/remotive"
