name: Set up RemotiveLabs tools
description: >
  Install the RemotiveLabs Toolchain Manager, the version `toolchain-manager-version` gives, and, with
  it, the RemotiveCLI as `remotive` on the PATH.
  The RemotiveCLI version is `cli-version` when given; otherwise the one the workspace's remotive.yaml
  pins (`tools.cli.version`); otherwise the latest release.

inputs:
  cli-version:
    description: >
      Exact RemotiveCLI version, such as 0.49.1, made the default. Inside a workspace that pins
      another version, the pin runs there. Empty: the version the workspace at or above
      `working-directory` pins, else the latest.
    default: ""
  working-directory:
    description: Where to look for the workspace's remotive.yaml when `cli-version` is empty.
    default: "."
  toolchain-manager-version:
    description: >
      Exact Toolchain Manager version, 0.0.18 or newer; not empty. The default is the one this action
      is tested with.
    default: "0.0.18"

outputs:
  cli-version:
    description: The RemotiveCLI version that runs in `working-directory`.
    value: ${{ steps.cli.outputs.version }}

runs:
  using: composite
  steps:
    # The version given, for this user, without root: RemotiveBus is left out, as CI has no CAN. The
    # script checks the Toolchain Manager against its signed checksum.
    - name: Install the Toolchain Manager
      shell: bash
      env:
        INSTALLER: https://files.remotivelabs.com/install-rtm.sh
        MANAGER_VERSION: ${{ inputs.toolchain-manager-version }}
      run: |
        cd "$RUNNER_TEMP"
        curl --proto '=https' --tlsv1.2 -fsSL "$INSTALLER" -o install-rtm.sh
        bash install-rtm.sh --user --no-remotivebus --replace "$MANAGER_VERSION"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install the RemotiveCLI
      id: cli
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        if [ -n "$CLI_VERSION" ]; then
          remotive toolchain cli install "$CLI_VERSION" --default
        else
          # The version the workspace pins, else the latest
          remotive toolchain install --no-remotivebus
        fi
        remotive toolchain current
        echo "version=$(remotive toolchain current --json | jq -r .cli.version)" >> "$GITHUB_OUTPUT"

branding:
  icon: 'download'
  color: 'blue'
